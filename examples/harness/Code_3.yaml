        code: "def main(extracted_text: str, plain_text: str, source_language: str):\n\
          \ttext = (extracted_text or '').strip() if extracted_text else ''\n\tif\
          \ not text:\n\t\ttext = (plain_text or '').strip()\n\tlang = (source_language\
          \ or '').strip().lower()\n\tif not text:\n\t\treturn {\n\t\t\t'analysis_text':\
          \ 'No code content was available after extraction or normalization.',\n\t\
          \t\t'is_valid_python': False,\n\t\t\t'validation_issue': 'No code content\
          \ was provided or extracted.'\n\t\t}\n\tif lang and 'python' not in lang\
          \ and 'py' not in lang:\n\t\treturn {\n\t\t\t'analysis_text': text,\n\t\t\
          \t'is_valid_python': False,\n\t\t\t'validation_issue': 'The provided source\
          \ language is not Python. This workflow normalizes and validates Python\
          \ code only.'\n\t\t}\n\ttry:\n\t\tcompile(text, '<provided_code>', 'exec')\n\
          \t\treturn {\n\t\t\t'analysis_text': text,\n\t\t\t'is_valid_python': True,\n\
          \t\t\t'validation_issue': ''\n\t\t}\n\texcept SyntaxError as exc:\n\t\t\
          return {\n\t\t\t'analysis_text': text,\n\t\t\t'is_valid_python': False,\n\
          \t\t\t'validation_issue': f'SyntaxError at line {exc.lineno}: {exc.msg}'\n\
          \t\t}\n\texcept Exception as exc:\n\t\treturn {\n\t\t\t'analysis_text':\
          \ text,\n\t\t\t'is_valid_python': False,\n\t\t\t'validation_issue': f'Validation\
          \ failed: {type(exc).__name__}: {exc}'\n\t\t}"
        code_language: python3
