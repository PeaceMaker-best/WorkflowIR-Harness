          \ + chunk_size]).strip()\n\t\tif chunk:\n\t\t\tchunks.append(chunk)\n\t\t\
          if start + chunk_size >= len(words):\n\t\t\tbreak\n\t\tstart += max(1, chunk_size\
          \ - overlap)\n\treturn {'chunks': chunks}"
