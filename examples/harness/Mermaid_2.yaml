    - data:
        code: "import re\n\ndef main(raw: str):\n\ttext = (raw or '').strip()\n\t\
          fence = chr(96) * 3\n\tif text.startswith(fence):\n\t\tlines = text.splitlines()\n\
          \t\ttext = '\\n'.join(lines[1:]) if len(lines) > 1 else ''\n\ttext = text.rstrip()\n\
          \tif text.endswith(fence):\n\t\ttext = text[:-3].rstrip()\n\tlines = [line.rstrip()\
          \ for line in text.splitlines() if line.strip()]\n\tif lines and lines[0].strip().lower()\
          \ == 'mindmap':\n\t\tclean = ['mindmap']\n\t\tfor line in lines[1:41]:\n\
          \t\t\tindent = line[:len(line) - len(line.lstrip())]\n\t\t\tlabel = line.strip()\n\
          \t\t\tis_root = label.lower().startswith('root')\n\t\t\tif is_root:\n\t\t\
          \t\tmatch = re.search(r'root\\s*\\(\\((.*?)\\)\\)', label, re.I)\n\t\t\t\
          \tlabel = match.group(1) if match else label[4:]\n\t\t\tlabel = re.sub(r'[^\\\
          w一-鿿 .,-]', ' ', label)\n\t\t\tlabel = re.sub(r'\\s+', ' ', label).strip()[:64]\
          \ or 'item'\n\t\t\tclean.append(indent + ('root((' + label + '))' if is_root\
          \ else label))\n\t\ttext = '\\n'.join(clean)\n\treturn {'mermaid_code':\
          \ text.strip()}\n"
