          \ \"<translated>\", \"exec\")\n\t\tcheck_msg = \"Format check: passed (valid\
          \ Python syntax).\"\n\texts = None\n\texcept SyntaxError as e:\n\t\treturn\
          \ {\"result\": \"Format check: FAILED - syntax error: \" + str(e)}\n\tnamespace\
          \ = {\"__name__\": \"__main__\", \"case_input\": case_input}\n\told_argv\
          \ = sys.argv\n\told_stdin = sys.stdin\n\tstdout_buf = io.StringIO()\n\t\
          sys.argv = [\"program\", case_input]\n\tsys.stdin = io.StringIO(case_input)\n\
          \ttry:\n\t\twith contextlib.redirect_stdout(stdout_buf):\n\t\t\texec(compile(python_code,\
          \ \"<translated>\", \"exec\"), namespace)\n\t\tout = stdout_buf.getvalue()\n\
          \t\tret = namespace.get(\"result\", None)\n\t\tparts = [check_msg, \"Execution:\
          \ succeeded.\"]\n\t\tif ret is not None:\n\t\t\tparts.append(\"Return value:\
          \ \" + str(ret))\n\t\tif out:\n\t\t\tparts.append(\"Program output:\\n\"\
          \ + out)\n\t\telse:\n\t\t\tparts.append(\"(no standard output)\")\n\t\t\
          return {\"result\": \"\\n\".join(parts)}\n\texcept Exception as e:\n\t\t\
          out = stdout_buf.getvalue()\n\t\tparts = [check_msg, \"Execution: FAILED\
          \ - \" + type(e).__name__ + \": \" + str(e)]\n\t\tif out:\n\t\t\tparts.append(\"\
          Partial output before error:\\n\" + out)\n\t\treturn {\"result\": \"\\n\"\
          .join(parts)}\n\tfinally:\n\t\tsys.argv = old_argv\n\t\tsys.stdin = old_stdin"
