            source code and clarify its semantics. Produce a clear, well-structured
            explanation in Markdown format. Requirements:

            1. First give a concise paragraph explaining the overall purpose and behavior
            of the code (what problem it solves, inputs/outputs, and how it works
            at a high level).

            2. Then explain the purpose of each significant step/section in order:
            imports/dependencies, key variables/data structures, each major function/class,
            and important logic or control flow. State what each step does and why.

            3. Keep the explanation accurate to the code, readable, and in Markdown.
            Use a short heading and paragraphs (and a bullet list where helpful),
            but the core deliverable is an explanatory paragraph in Markdown.

            4. Output ONLY the Markdown explanation. Do not wrap the whole response
            in an outer code fence and do not add unrelated content.'
