<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Stable workflow results across 96 system trials</title>
  <desc id="desc">Sixteen benchmark tasks with three inputs and two systems form 48 matched pairs and 96 system trials. WorkflowIR-Harness had 15 of 16 stable runtime workflows compared with 10 of 16 official Agentic artifacts.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 800; fill: #ffffff; }
    .group { font-size: 18px; font-weight: 800; fill: #d9e7ff; }
    .value { font-size: 28px; font-weight: 800; fill: #ffffff; }
    .note { font-size: 14px; fill: #b7c6df; }
    .cell { stroke: #0b1020; stroke-width: 4; }
  </style>
  <rect width="1200" height="430" fill="#0b1020"/>
  <text x="44" y="48" class="title">STABLE MEANS ONE FROZEN WORKFLOW PASSES ALL 3 INPUTS</text>
  <text x="44" y="76" class="note">16 tasks × 3 fixed inputs × 2 systems = 48 matched pairs / 96 system trials</text>

  <text x="44" y="126" class="group">STABLE RUNTIME WORKFLOWS</text>
  <text x="44" y="168" class="value">OFFICIAL 10/16</text>
  <g transform="translate(300 142)" shape-rendering="crispEdges">
    <rect class="cell" x="0" y="0" width="42" height="42" fill="#fb7185"/><rect class="cell" x="42" y="0" width="42" height="42" fill="#fb7185"/><rect class="cell" x="84" y="0" width="42" height="42" fill="#fb7185"/><rect class="cell" x="126" y="0" width="42" height="42" fill="#fb7185"/><rect class="cell" x="168" y="0" width="42" height="42" fill="#fb7185"/><rect class="cell" x="210" y="0" width="42" height="42" fill="#fb7185"/><rect class="cell" x="252" y="0" width="42" height="42" fill="#fb7185"/><rect class="cell" x="294" y="0" width="42" height="42" fill="#fb7185"/><rect class="cell" x="336" y="0" width="42" height="42" fill="#fb7185"/><rect class="cell" x="378" y="0" width="42" height="42" fill="#fb7185"/>
    <rect class="cell" x="420" y="0" width="42" height="42" fill="#25324d"/><rect class="cell" x="462" y="0" width="42" height="42" fill="#25324d"/><rect class="cell" x="504" y="0" width="42" height="42" fill="#25324d"/><rect class="cell" x="546" y="0" width="42" height="42" fill="#25324d"/><rect class="cell" x="588" y="0" width="42" height="42" fill="#25324d"/><rect class="cell" x="630" y="0" width="42" height="42" fill="#25324d"/>
  </g>
  <text x="44" y="224" class="value">HARNESS 15/16</text>
  <g transform="translate(300 198)" shape-rendering="crispEdges">
    <rect class="cell" x="0" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="42" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="84" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="126" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="168" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="210" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="252" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="294" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="336" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="378" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="420" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="462" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="504" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="546" y="0" width="42" height="42" fill="#5eead4"/><rect class="cell" x="588" y="0" width="42" height="42" fill="#5eead4"/>
    <rect class="cell" x="630" y="0" width="42" height="42" fill="#25324d"/>
  </g>

  <line x1="44" y1="278" x2="1156" y2="278" stroke="#334155" stroke-width="4"/>
  <text x="44" y="326" class="group">STABLE SEMANTIC WORKFLOWS</text>
  <text x="44" y="374" class="value">OFFICIAL 5/16</text>
  <text x="394" y="374" class="value" fill="#5eead4">HARNESS 9/16</text>
  <text x="760" y="374" class="group">ALL HARNESS RUNTIME</text>
  <text x="1040" y="374" class="value">18/19</text>
  <text x="44" y="410" class="note">A stable result cannot be assembled from three different lucky generations.</text>
</svg>
