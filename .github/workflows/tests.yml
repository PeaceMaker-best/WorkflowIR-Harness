name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python tests/offline_selftest.py
      - run: PYTHONPATH=src python tests/experience_pool_selftest.py
      - run: PYTHONPATH=src python tests/runner_logic_selftest.py
      - run: PYTHONPATH=src python tests/contract_repairs_selftest.py --yaml-dir examples/harness
